<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PersonApp - Gestión de Personas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .main-content {
            padding: 40px;
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .db-selector {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .db-selector label {
            font-weight: 600;
            color: #333;
        }
        
        select, button, input {
            padding: 12px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }
        
        .form-section h3 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.3rem;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        
        .persons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .person-card {
            background: white;
            border: 1px solid #e1e5e9;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .person-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .person-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .person-id {
            font-size: 1.2rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .person-name {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 8px;
        }
        
        .person-details {
            color: #666;
            font-size: 0.95rem;
        }
        
        .database-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 10px;
        }
        
        .maria-badge {
            background: #e3f2fd;
            color: #1976d2;
        }
        
        .mongo-badge {
            background: #e8f5e8;
            color: #388e3c;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #c62828;
        }
        
        .success {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #4caf50;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e1e5e9;
            flex: 1;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .stats {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧑‍💼 PersonApp</h1>
            <p>Sistema de Gestión de Personas - Arquitectura Hexagonal</p>
        </div>
        
        <div class="main-content">
            <!-- Estadísticas -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalPersons">0</div>
                    <div class="stat-label">Total Personas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="mariaCount">0</div>
                    <div class="stat-label">En MariaDB</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="mongoCount">0</div>
                    <div class="stat-label">En MongoDB</div>
                </div>
            </div>

            <!-- Controles principales -->
            <div class="controls">
                <div class="db-selector">
                    <label for="database">Base de Datos:</label>
                    <select id="database">
                        <option value="MARIA">MariaDB</option>
                        <option value="MONGO">MongoDB</option>
                    </select>
                </div>
                <button onclick="loadPersons()">🔄 Cargar Personas</button>
                <button onclick="loadBothDatabases()">📊 Cargar Ambas BD</button>
                <button onclick="window.open('/swagger-ui.html', '_blank')">📖 Ver API Docs</button>
            </div>

            <!-- Formulario para crear persona -->
            <div class="form-section">
                <h3>➕ Crear Nueva Persona</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="dni">Cédula:</label>
                        <input type="number" id="dni" placeholder="Ej: 123456789">
                    </div>
                    <div class="form-group">
                        <label for="firstName">Nombre:</label>
                        <input type="text" id="firstName" placeholder="Ej: Juan">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Apellido:</label>
                        <input type="text" id="lastName" placeholder="Ej: Pérez">
                    </div>
                    <div class="form-group">
                        <label for="age">Edad:</label>
                        <input type="number" id="age" placeholder="Ej: 30" min="0" max="120">
                    </div>
                    <div class="form-group">
                        <label for="sex">Género:</label>
                        <select id="sex">
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                            <option value="O">Otro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="createDatabase">Guardar en:</label>
                        <select id="createDatabase">
                            <option value="MARIA">MariaDB</option>
                            <option value="MONGO">MongoDB</option>
                        </select>
                    </div>
                </div>
                <button onclick="createPerson()">➕ Crear Persona</button>
            </div>

            <!-- Área de mensajes -->
            <div id="messages"></div>

            <!-- Área de carga -->
            <div id="loading" class="loading" style="display: none;">
                <h3>⏳ Cargando datos...</h3>
            </div>

            <!-- Lista de personas -->
            <div id="persons-container">
                <h3>👥 Lista de Personas</h3>
                <div id="persons-list" class="persons-grid"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1/persona';
        
        // Mostrar mensajes
        function showMessage(message, type = 'info') {
            const messagesDiv = document.getElementById('messages');
            const messageElement = document.createElement('div');
            messageElement.className = type;
            messageElement.textContent = message;
            messagesDiv.appendChild(messageElement);
            
            setTimeout(() => {
                messageElement.remove();
            }, 5000);
        }

        // Mostrar/ocultar loading
        function setLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // Cargar personas de una base de datos
        async function loadPersons() {
            const database = document.getElementById('database').value;
            setLoading(true);
            
            try {
                const response = await fetch(`${API_BASE}/${database}`);
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }
                
                const persons = await response.json();
                displayPersons(persons, database);
                updateStats(persons, database);
                showMessage(`✅ Cargadas ${persons.length} personas desde ${database}`, 'success');
            } catch (error) {
                console.error('Error:', error);
                showMessage(`❌ Error al cargar datos: ${error.message}`, 'error');
            } finally {
                setLoading(false);
            }
        }

        // Cargar de ambas bases de datos
        async function loadBothDatabases() {
            setLoading(true);
            
            try {
                const [mariaResponse, mongoResponse] = await Promise.all([
                    fetch(`${API_BASE}/MARIA`),
                    fetch(`${API_BASE}/MONGO`)
                ]);

                const mariaPersons = mariaResponse.ok ? await mariaResponse.json() : [];
                const mongoPersons = mongoResponse.ok ? await mongoResponse.json() : [];
                
                const allPersons = [
                    ...mariaPersons.map(p => ({...p, database: 'MariaDB'})),
                    ...mongoPersons.map(p => ({...p, database: 'MongoDB'}))
                ];
                
                displayPersons(allPersons, 'BOTH');
                updateStatsFromBoth(mariaPersons, mongoPersons);
                showMessage(`✅ Cargadas ${allPersons.length} personas total (${mariaPersons.length} MariaDB, ${mongoPersons.length} MongoDB)`, 'success');
            } catch (error) {
                console.error('Error:', error);
                showMessage(`❌ Error al cargar datos: ${error.message}`, 'error');
            } finally {
                setLoading(false);
            }
        }

        // Mostrar personas en la interfaz
        function displayPersons(persons, source) {
            const container = document.getElementById('persons-list');
            
            if (!persons || persons.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">No hay personas registradas</p>';
                return;
            }
            
            container.innerHTML = persons.map(person => `
                <div class="person-card">
                    <div class="person-id">ID: ${person.dni || person.identification || 'N/A'}</div>
                    <div class="person-name">${person.firstName || 'Sin nombre'} ${person.lastName || 'Sin apellido'}</div>
                    <div class="person-details">
                        <strong>Edad:</strong> ${person.age || 'No especificada'}<br>
                        <strong>Género:</strong> ${getGenderText(person.sex)}
                    </div>
                    <span class="database-badge ${person.database === 'MariaDB' ? 'maria-badge' : 'mongo-badge'}">
                        ${person.database}
                    </span>
                </div>
            `).join('');
        }

        // Obtener texto del género
        function getGenderText(sex) {
            switch(sex) {
                case 'M': case 'MALE': return 'Masculino';
                case 'F': case 'FEMALE': return 'Femenino';
                case 'O': case 'OTHER': return 'Otro';
                default: return 'No especificado';
            }
        }

        // Actualizar estadísticas
        function updateStats(persons, database) {
            const total = persons.length;
            document.getElementById('totalPersons').textContent = total;
            
            if (database === 'MARIA') {
                document.getElementById('mariaCount').textContent = total;
                document.getElementById('mongoCount').textContent = '0';
            } else if (database === 'MONGO') {
                document.getElementById('mongoCount').textContent = total;
                document.getElementById('mariaCount').textContent = '0';
            }
        }

        // Actualizar estadísticas desde ambas BD
        function updateStatsFromBoth(mariaPersons, mongoPersons) {
            document.getElementById('mariaCount').textContent = mariaPersons.length;
            document.getElementById('mongoCount').textContent = mongoPersons.length;
            document.getElementById('totalPersons').textContent = mariaPersons.length + mongoPersons.length;
        }

        // Crear nueva persona
        async function createPerson() {
            const formData = {
                dni: document.getElementById('dni').value,
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                age: document.getElementById('age').value,
                sex: document.getElementById('sex').value,
                database: document.getElementById('createDatabase').value
            };

            // Validaciones básicas
            if (!formData.dni || !formData.firstName || !formData.lastName) {
                showMessage('❌ Por favor complete los campos obligatorios (Cédula, Nombre, Apellido)', 'error');
                return;
            }

            try {
                setLoading(true);
                const response = await fetch(API_BASE, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }

                const result = await response.json();
                showMessage(`✅ Persona creada exitosamente en ${formData.database}`, 'success');
                
                // Limpiar formulario
                document.getElementById('dni').value = '';
                document.getElementById('firstName').value = '';
                document.getElementById('lastName').value = '';
                document.getElementById('age').value = '';
                
                // Recargar datos
                loadBothDatabases();
                
            } catch (error) {
                console.error('Error:', error);
                showMessage(`❌ Error al crear persona: ${error.message}`, 'error');
            } finally {
                setLoading(false);
            }
        }

        // Cargar datos al iniciar
        document.addEventListener('DOMContentLoaded', function() {
            loadBothDatabases();
        });

        // Tecla Enter en formulario
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
                createPerson();
            }
        });
    </script>
</body>
</html>
