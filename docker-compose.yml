version: '3.8'

services:
  mariadb:
      image: mariadb:10.6
      container_name: mariadb_persona
      restart: always
      environment:
        MARIADB_ROOT_PASSWORD: rootpassword
        MARIADB_DATABASE: persona_db
        MARIADB_USER: persona_db
        MARIADB_PASSWORD: persona_db
      ports:
        - "3306:3306"
      volumes:
        - mariadb_data:/var/lib/mysql
        - ./scripts/persona_ddl_maria.sql:/docker-entrypoint-initdb.d/persona_ddl_maria.sql:ro
        - ./scripts/persona_dml_maria.sql:/docker-entrypoint-initdb.d/persona_dml_maria.sql:ro
      networks:
        - backend
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        timeout: 10s
        retries: 5

  mongodb:
    image: mongo:6
    container_name: mongodb_persona
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: persona_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/persona_ddl_mongo.js:/docker-entrypoint-initdb.d/persona_ddl_mongo.js:ro
      - ./scripts/persona_dml_mongo.js:/docker-entrypoint-initdb.d/persona_dml_mongo.js:ro
    networks:
      - backend
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  personapp-rest:
    build:
      context: ./rest-input-adapter
      dockerfile: Dockerfile
    container_name: personapp_rest_api
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      mariadb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/persona_db
      - SPRING_DATA_MONGODB_HOST=mongodb
      - SPRING_DATA_MONGODB_PORT=27017
    networks:
      - backend
    volumes:
      - ./logs:/app/logs

  personapp-cli:
    build:
      context: ./cli-input-adapter
      dockerfile: Dockerfile
    container_name: personapp_cli
    restart: "no"
    depends_on:
      mariadb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/persona_db
      - SPRING_DATA_MONGODB_HOST=mongodb
      - SPRING_DATA_MONGODB_PORT=27017
    networks:
      - backend
    volumes:
      - ./logs:/app/logs
    stdin_open: true
    tty: true

volumes:
  mariadb_data:
  mongodb_data:

networks:
  backend: