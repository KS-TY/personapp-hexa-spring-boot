
services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb-container
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123 
      MYSQL_DATABASE: persona_db
      MYSQL_USER: persona_db 
      MYSQL_PASSWORD: persona_db 
    ports:
      - "3306:3306" 
    volumes:
      - mariadb_data:/var/lib/mysql 
      - ./scripts/persona_ddl_maria.sql:/docker-entrypoint-initdb.d/persona_ddl_maria.sql
    networks:
      - proyecto_network

  mongodb:
    image: mongo:latest
    container_name: mongodb-container
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin 
      MONGO_INITDB_ROOT_PASSWORD: admin 
      MONGO_INITDB_DATABASE: admin
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/persona_ddl_mongo.js:/docker-entrypoint-initdb.d/persona_ddl_mongo.js
    networks:
      - proyecto_network
    command: ["--auth"]

volumes:
  mariadb_data:
  mongodb_data:

networks:
  proyecto_network:
    driver: bridge